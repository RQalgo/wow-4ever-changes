# .github/workflows/update-data.yml
#
# Scheduled data update (hourly): fetches every source in data/sources.json (Blizzard's
# rolling "WoW: Forever Hotfixes" post, the forum's patch-notes topic and the
# forum's Blizzard tracker for dev posts), regenerates data/changes.json via
# scripts/update.mjs, and commits the result to main only when something
# actually changed.
#
# Design notes:
#   - There is no deploy step. GitHub Pages is set to "deploy from branch:
#     main, root", so a commit that changes data/changes.json republishes the
#     site by itself.
#   - The tests run before the update so a broken pipeline never publishes.
#   - The update script refuses to overwrite data on an empty parse, so a
#     changed source layout fails this job instead of blanking the site.
#   - No secrets are needed; the built-in GITHUB_TOKEN pushes the commit.

name: Update data

on:
  schedule:
    # Every hour at minute 41 (UTC). GitHub delays scheduled runs and drops
    # many of them when its runners are busy: with the earlier 3-hourly
    # schedule ('09 */3 * * *') only about 3 of the 8 daily runs actually
    # started, so a hotfix posted just after a run could wait 10+ hours to
    # appear (Blizzard's forum copy of the November 23, 2026 hotfixes was
    # posted one minute before a run read the news page, and no run followed
    # for over 10 hours). Hourly runs keep
    # the gap short even when some are dropped. Each run makes only a few
    # requests (one news page, one forum topic, two or three tracker pages;
    # post bodies only for new posts), and Actions minutes are free for
    # public repositories. Minute :41 is off-peak: GitHub delays or drops
    # scheduled runs most in the congested slots at the top of the hour.
    # Note: GitHub registers a schedule when the workflow file on the default
    # branch changes.
    - cron: '41 * * * *'
  # Allow running it manually from the Actions tab.
  workflow_dispatch:
    inputs:
      tracker_cutoff:
        # One-off backfill: page the Blizzard tracker back to this date
        # (YYYY-MM-DD) instead of the usual "newest stored dev day minus 7
        # days", e.g. after adding a forum category to data/sources.json.
        # Leave empty for a normal run. Read by scripts/update.mjs as the
        # TRACKER_CUTOFF environment variable.
        description: 'Optional: page dev posts back to this date (YYYY-MM-DD)'
        required: false
        default: ''

# The job commits data files back to the repository.
permissions:
  contents: write

# Never run two updates at once; let a running one finish instead of
# cancelling it midway (a cancelled push could leave stale data).
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Check out main (the default branch) with a token that can push.
      - uses: actions/checkout@v4

      # Node 22 with npm download caching.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Clean, lockfile-exact dependency install.
      - run: npm ci

      # Gate: do not touch data if the code's own tests fail.
      - run: npm test

      # Cache the game-data index built by scripts/gamedata.mjs (.cache/gamedata:
      # index-<build>.json plus the Wowhead talent file). Building it downloads
      # tens of MB of tables from wago.tools, which is only needed when a new
      # game build appears. The key is unique per run so a changed index is
      # saved at the end of the run; restore-keys makes every run start from the
      # newest saved one (caches are immutable, so a fixed key would never update).
      - uses: actions/cache@v4
        with:
          path: .cache/gamedata
          key: gamedata-${{ runner.os }}-${{ github.run_id }}
          restore-keys: gamedata-${{ runner.os }}-

      # Fetch, parse, resolve icons, and write data/changes.json if changed.
      # The script prints a one-line summary such as
      # "updated: 3 days, 120 changes"; capture it for the job summary.
      # pipefail matters: without it the step would take tee's exit status
      # and a failed update would look like a success.
      - name: Run update
        id: update
        shell: bash
        # Empty on scheduled runs; set from the manual-run input otherwise.
        # Passed as an environment variable, never interpolated into the
        # script, so its content cannot run as shell code.
        env:
          TRACKER_CUTOFF: ${{ inputs.tracker_cutoff }}
        run: |
          set -o pipefail
          node scripts/update.mjs | tee update.log
          echo "line=$(tail -n 1 update.log)" >> "$GITHUB_OUTPUT"

      # Show days/changes counts on the workflow run page.
      # The value is passed through an environment variable rather than
      # being interpolated into the script text, so its content can never be
      # interpreted as shell code.
      - name: Job summary
        env:
          RESULT_LINE: ${{ steps.update.outputs.line }}
        run: |
          echo "Data update result - $RESULT_LINE" >> "$GITHUB_STEP_SUMMARY"

      # Commit and push only if files under data/ differ from HEAD.
      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "No data changes; nothing to commit."
            exit 0
          fi
          # Commit as the standard GitHub Actions bot identity.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only the data/ folder is staged, so stray files in the repo root
          # (e.g. update.log) are never committed, and a data file that does
          # not exist yet cannot fail the step.
          git add data/
          git commit -m "data: update changes ($(date -u +%Y-%m-%d))"
          # main may have moved while the job ran (e.g. a merged PR); replay
          # the data commit on top of it before pushing.
          git pull --rebase origin main
          git push
